[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pm-flow"
dynamic = ["version"]
description = "A headless agent team that cuts a product into sections, drives each one, and escalates what fails"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Salah Ghanim" }]
keywords = ["agents", "orchestration", "llm", "observability", "opentelemetry"]

# Nothing. The engine is zsh and standard-library python, and that is worth
# keeping: a dependency here would have to resolve on every machine the flow is
# installed into, including ones where python is not the project's language.
dependencies = []

[project.optional-dependencies]
# Only `pm-flow trace export --otlp` needs these. Exporting to a file needs
# nothing, and recording to the store never depends on an import - a missing
# package should cost an observation, not a dispatch.
telemetry = [
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
]
grpc = ["opentelemetry-exporter-otlp-proto-grpc>=1.30"]

[project.scripts]
pm-flow = "pm_flow.cli:main"

[project.urls]
Homepage = "https://github.com/salah-ghanim/pm-flow"

[tool.hatch.version]
# One source of truth. It used to be read by the manifest generator and the
# installer as well, because the engine was copied into every repository and
# something had to record which copy was which. Nothing copies the engine now,
# so the version this file holds is the package's and nothing else's.
path = "VERSION"
pattern = "^(?P<version>.+?)\\s*$"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_flow"]

[tool.hatch.build.targets.wheel.force-include]
# The engine travels with the package rather than being copied into a
# repository. This is the whole point: one installed copy per virtual
# environment, versioned by the package manager, never edited in place.
"template/.agentic/pm_flow" = "pm_flow/engine"
